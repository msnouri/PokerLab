name: Mac app bundle
# Manual or tag-triggered: builds an unsigned PokerLab.app and uploads it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gui.txt
      - run: python -m pip install -r requirements-gui.txt pyinstaller
      - run: pyinstaller packaging/pokerlab.spec --noconfirm
      - name: The bundled app starts and draws the Agent Lab
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/PokerLab.app/Contents/MacOS/PokerLab --lab --seed 120 --screenshot agent-lab.png
          test -s agent-lab.png
      - name: Ad-hoc signature (not a Developer ID; see packaging/README.md)
        run: codesign --force --deep --sign - dist/PokerLab.app
      - run: ditto -c -k --keepParent dist/PokerLab.app PokerLab-${{ matrix.os }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: PokerLab-${{ matrix.os }}
          path: |
            PokerLab-${{ matrix.os }}.zip
            agent-lab.png
